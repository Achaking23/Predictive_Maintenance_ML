# Model Configuration
# ====================

models:
  gradient_boosting:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 5
      learning_rate: 0.1
      subsample: 0.8
      random_state: 42

  random_forest:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 5
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1

  logistic_regression:
    enabled: true
    params:
      max_iter: 2000
      class_weight: "balanced"
      random_state: 42

evaluation:
  cv_folds: 5
  test_size: 0.2
  random_state: 42
  scoring: "f1"

thresholds:
  overall: 0.37
  TWF: 0.50
  HDF: 0.50
  PWF: 0.50
  OSF: 0.45
  RNF: 0.50